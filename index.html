<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>간편 계좌 송금</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Pretendard", sans-serif; }
    body { background-color: #f4f6f8; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
    .card { background: #ffffff; width: 100%; max-width: 400px; border-radius: 20px; padding: 30px 24px; box-shadow: 0 10px 25px rgba(0,0,0,0.06); text-align: center; }
    .title { font-size: 18px; font-weight: 700; color: #191f28; margin-bottom: 6px; }
    .subtitle { font-size: 13px; color: #6b7684; margin-bottom: 24px; }
    
    /* 계좌 정보 박스 */
    .account-box { background: #f9fafb; border: 1px solid #e5e8eb; border-radius: 14px; padding: 22px 18px; margin-bottom: 24px; cursor: pointer; transition: background 0.2s; -webkit-tap-highlight-color: transparent; }
    .account-box:active { background: #f2f4f6; }
    
    .bank-name { font-size: 15px; color: #4e5968; font-weight: 600; margin-bottom: 6px; }
    .account-num { font-size: 22px; font-weight: 700; color: #191f28; letter-spacing: -0.3px; margin-bottom: 14px; word-break: keep-all; }
    .copy-badge { display: inline-block; background: #e8f3ff; color: #1b64da; font-size: 12px; font-weight: 600; padding: 6px 14px; border-radius: 20px; }

    /* 송금 버튼 리스트 */
    .btn-group { display: flex; flex-direction: column; gap: 12px; }
    .btn { display: flex; align-items: center; justify-content: center; width: 100%; height: 54px; border-radius: 12px; font-size: 16px; font-weight: 700; text-decoration: none; border: none; cursor: pointer; transition: transform 0.1s; -webkit-tap-highlight-color: transparent; }
    .btn:active { transform: scale(0.98); }
    
    .btn-toss { background-color: #0064FF; color: #ffffff; }
    .btn-kakao { background-color: #FEE500; color: #191919; }
    .btn-naver { background-color: #03C75A; color: #ffffff; }

    /* 안내 문구 */
    .guide-text { margin-top: 18px; font-size: 12px; color: #8b95a1; line-height: 1.5; }

    /* 토스트 알림 */
    .toast { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); background: rgba(25, 31, 40, 0.92); color: #fff; padding: 12px 20px; border-radius: 30px; font-size: 13px; opacity: 0; transition: opacity 0.3s; pointer-events: none; white-space: nowrap; z-index: 100; }
    .toast.show { opacity: 1; }
  </style>
</head>
<body>

<div class="card">
  <div class="title">송금하실 앱을 선택해 주세요</div>
  <div class="subtitle">버튼을 누르면 계좌번호가 자동 복사됩니다</div>

  <!-- 계좌 정보 박스 -->
  <div class="account-box" onclick="copyAccount(true)">
    <div class="bank-name" id="displayBank">우리은행</div>
    <div class="account-num" id="displayAccount">1002 338 770066</div>
    <span class="copy-badge" id="copyStatus">터치하여 계좌번호 복사</span>
  </div>

  <!-- 간편송금 버튼 영역 -->
  <div class="btn-group">
    <button type="button" class="btn btn-toss" onclick="openApp('toss')">토스로 송금하기</button>
    <button type="button" class="btn btn-kakao" onclick="openApp('kakao')">카카오페이로 송금하기</button>
    <button type="button" class="btn btn-naver" onclick="openApp('naver')">네이버페이로 송금하기</button>
  </div>

  <div class="guide-text">
    앱이 열리면 복사된 계좌번호를 붙여넣기 해주세요.
  </div>
</div>

<div class="toast" id="toast">계좌번호가 클립보드에 복사되었습니다.</div>

<script>
  // [기본 계좌 및 URL 설정]
  const DEFAULT_BANK = "우리은행";
  const DEFAULT_ACCOUNT = "1002 338 770066";
  const NAVER_REMIT_URL = "https://pay.naver.com/remit/qr/inflow?v=1&a=1002338770066&c=020&d=d7ac99f0b290a6e01dd6319879753753";

  let currentBank = DEFAULT_BANK;
  let currentAccount = DEFAULT_ACCOUNT;

  // 페이지 로드 시 초기화 (URL 파라미터 우선 지원)
  window.addEventListener('DOMContentLoaded', () => {
    const params = new URLSearchParams(window.location.search);
    const paramBank = params.get('bank');
    const paramAcc = params.get('acc');

    if (paramBank && paramAcc) {
      currentBank = paramBank;
      currentAccount = paramAcc;
    }

    document.getElementById('displayBank').innerText = currentBank;
    document.getElementById('displayAccount').innerText = currentAccount;

    // 진입 즉시 자동 복사 시도
    copyAccount(false);
  });

  // 클립보드 복사 함수
  async function copyAccount(showAlert = true) {
    const copyText = `${currentBank} ${currentAccount}`;
    try {
      await navigator.clipboard.writeText(copyText);
      updateCopyUI(true, showAlert);
    } catch (err) {
      const textArea = document.createElement("textarea");
      textArea.value = copyText;
      document.body.appendChild(textArea);
      textArea.select();
      try {
        document.execCommand('copy');
        updateCopyUI(true, showAlert);
      } catch (e) {
        updateCopyUI(false, false);
      }
      document.body.removeChild(textArea);
    }
  }

  function updateCopyUI(success, showAlert) {
    const badge = document.getElementById('copyStatus');
    if (success) {
      badge.innerText = "✓ 계좌번호 복사 완료";
      badge.style.background = "#e6f8ef";
      badge.style.color = "#03a64b";
      if (showAlert) showToast(`복사 완료: ${currentBank} ${currentAccount}`);
    }
  }

  function showToast(msg) {
    const toast = document.getElementById('toast');
    toast.innerText = msg;
    toast.classList.add('show');
    setTimeout(() => toast.classList.remove('show'), 2500);
  }

  // 간편송금 앱 실행
  function openApp(type) {
    copyAccount(true);

    const cleanAccount = currentAccount.replace(/[\s-]/g, '');

    setTimeout(() => {
      if (type === 'toss') {
        const schemeUrl = `supertoss://send?bank=${encodeURIComponent(currentBank)}&accountNo=${cleanAccount}`;
        launchScheme(schemeUrl, "https://toss.im");
      } 
      else if (type === 'kakao') {
        const schemeUrl = "kakaotalk://kakaopay/money/to/bank";
        launchScheme(schemeUrl, "https://www.kakaopay.com");
      } 
      else if (type === 'naver') {
        window.location.href = NAVER_REMIT_URL;
      }
    }, 250);
  }

  // 커스텀 스킴 호출 및 미설치 시 폴백 처리
  function launchScheme(schemeUrl, fallbackUrl) {
    const clickedAt = Date.now();
    window.location.href = schemeUrl;

    setTimeout(() => {
      if (Date.now() - clickedAt < 2000 && !document.hidden) {
        window.location.href = fallbackUrl;
      }
    }, 1500);
  }
</script>

</body>
</html>
